name: Tes Koneksi (manual)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Tes RealMarketAPI + Binance + Telegram
        env:
          REALMARKET_API_KEY: ${{ secrets.REALMARKET_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SYMBOLS: ${{ vars.SYMBOLS }}
          CRYPTO_SYMBOLS: ${{ vars.CRYPTO_SYMBOLS }}
        run: cd engine && python test_connection.py
