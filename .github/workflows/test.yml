name: Tes Koneksi (manual)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tes RealMarketAPI + Binance
        env:
          REALMARKET_API_KEY: ${{ secrets.REALMARKET_API_KEY }}
          FOREX_SYMBOLS: XAUUSD
          CRYPTO_SYMBOLS: ${{ vars.CRYPTO_SYMBOLS || 'BTCUSDT,ETHUSDT,BNBUSDT,XRPUSDT,SOLUSDT,TRXUSDT,DOGEUSDT,ZECUSDT,LINKUSDT,ADAUSDT' }}
        run: cd engine && python test_connection.py
