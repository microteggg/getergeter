name: Keepalive Trigger (picu Market Engine tiap 10 mnt)

# Memicu engine.yml setiap 10 menit (menit :03 :13 :23 :33 :43 :53),
# lalu menyambung dirinya sendiri sebelum batas 6 jam GitHub.
# Mematikan: Settings > Secrets and variables > Actions > Variables
#            buat variable KEEPALIVE_OFF = 1  (hapus untuk menyalakan lagi)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/keepalive.yml"]
  schedule:
    - cron: "17 */3 * * *"      # cadangan jika rantai sempat putus

permissions:
  actions: write                # memicu workflow (engine.yml & dirinya)
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      ENGINE: engine.yml
      MAX_SECONDS: 20400        # 5 jam 40 mnt
    steps:
      - name: Cek saklar OFF & keepalive dobel
        id: guard
        run: |
          if [ "${{ vars.KEEPALIVE_OFF }}" = "1" ]; then
            echo "Keepalive dimatikan (KEEPALIVE_OFF=1)."
            echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          n=$(gh run list -w keepalive.yml -s in_progress --json databaseId \
              --jq "[.[] | select(.databaseId != ${{ github.run_id }})] | length")
          echo "Keepalive lain yang aktif: $n"
          if [ "$n" -gt 0 ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; fi

      - name: Picu Market Engine tiap 10 menit
        if: steps.guard.outputs.skip != '1'
        run: |
          start=$(date +%s)
          trigger() {
            if gh workflow run "$ENGINE" --ref main; then
              echo "$(TZ=Asia/Jakarta date '+%d/%m %H:%M:%S WIB')  ✅ engine dipicu"
            else
              echo "$(TZ=Asia/Jakarta date '+%d/%m %H:%M:%S WIB')  ⚠️ gagal memicu, coba slot berikutnya"
            fi
          }
          trigger
          while true; do
            now=$(date +%s)
            m=$(( (now / 60) % 10 )); s=$(( now % 60 ))
            wait=$(( ((3 - m + 10) % 10) * 60 - s ))
            [ "$wait" -le 5 ] && wait=$(( wait + 600 ))
            if [ $(( now + wait - start )) -ge "$MAX_SECONDS" ]; then
              echo "Mendekati batas 6 jam, sambung ke run baru."; break
            fi
            sleep "$wait"
            trigger
          done

      - name: Sambung rantai (jalankan keepalive baru)
        # !cancelled(): kalau Anda Cancel manual, rantai benar-benar berhenti
        if: ${{ !cancelled() && steps.guard.outputs.skip != '1' }}
        run: gh workflow run keepalive.yml --ref main
