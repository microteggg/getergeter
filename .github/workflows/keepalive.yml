name: Keepalive Trigger (cadangan Market Engine)

# engine.yml sudah memiliki cron */5 * * * *.
# Workflow ini hanya cadangan apabila scheduler GitHub terlambat/terhenti sementara.
# Set repository variable KEEPALIVE_OFF=1 untuk menonaktifkan cadangan ini.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/keepalive.yml"]
  schedule:
    - cron: "17 */3 * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Picu Market Engine sebagai cadangan
        if: ${{ vars.KEEPALIVE_OFF != '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run engine.yml --repo "${{ github.repository }}" --ref main
          echo "Market Engine dipicu sebagai keepalive cadangan."
