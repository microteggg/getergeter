name: Market Engine (5 menit)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["docs/**", "engine/**", "requirements.txt", ".github/workflows/engine.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: market-engine
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Ambil data tersimpan (branch data)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: data
          path: store

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Terapkan build hook dashboard
        run: python engine/lazy_patch.py

      - name: Jalankan engine
        env:
          REALMARKET_API_KEY: ${{ secrets.REALMARKET_API_KEY }}
          FOREX_SYMBOLS: XAUUSD
          CRYPTO_SYMBOLS: ${{ vars.CRYPTO_SYMBOLS || 'BTCUSDT,ETHUSDT,BNBUSDT,XRPUSDT,SOLUSDT,TRXUSDT,DOGEUSDT,ZECUSDT,LINKUSDT,ADAUSDT' }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          ALERT_TFS: ${{ vars.ALERT_TFS }}
          ALERT_SIGNAL: ${{ vars.ALERT_SIGNAL }}
          ALERT_WITH_CHART: ${{ vars.ALERT_WITH_CHART }}
          LARGE_TRADE_USD: ${{ vars.LARGE_TRADE_USD }}
          SKIP_WEEKEND: ${{ vars.SKIP_WEEKEND }}
        run: |
          mkdir -p store/candles store/journal store/private_state _site
          rm -rf store/.git
          cp -r docs/. _site/
          cd engine && python main.py --store ../store --site ../_site

      - name: Cek hasil build dashboard
        run: |
          test -f _site/data/state.json || { echo "::error::state.json tidak dibuat engine"; exit 1; }
          test -f _site/app.js || { echo "::error::app.js tidak ditemukan"; exit 1; }
          test -f _site/index.html || { echo "::error::index.html tidak ditemukan"; exit 1; }
          grep -q 'v10-lazy' _site/app.js || { echo "::error::SMC v2 compatibility build belum terpasang"; exit 1; }
          python - <<'PY'
          import glob, json, time
          with open("_site/data/state.json", encoding="utf-8") as f:
              s = json.load(f)
          age = (time.time() - s["updated_ts"]) / 60
          chunks = glob.glob("_site/data/history/*.json")
          print(f"updated_ts {s['updated_ts']} ({age:.1f} mnt lalu), pair: {list(s.get('pairs', {}))}")
          print(f"history chunks: {len(chunks)}")
          PY

      - name: Simpan seluruh store ke branch data
        run: |
          cd store
          git init -q -b data
          git config user.name "market-engine"
          git config user.email "market-engine@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan pada store"
          else
            git commit -q -m "data $(date -u +%Y-%m-%dT%H:%MZ)"
          fi
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
